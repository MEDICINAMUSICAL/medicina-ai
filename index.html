
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDICINA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071426;color:white;text-align:center}
header{padding:35px 15px;background:linear-gradient(135deg,#092c50,#101044)}
h1{font-size:38px;color:#39e6ff;margin:5px}
header p{color:#c7d8ed}
main{max-width:700px;margin:35px auto;padding:20px}
.panel{background:#10243d;padding:25px;border-radius:18px;border:1px solid #1c597a}
h2{color:#39e6ff}
textarea{width:100%;height:110px;padding:15px;border-radius:10px;border:0;font-size:16px;resize:vertical}
button{margin-top:15px;padding:14px 25px;background:#00c9df;color:#001525;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
#respuesta{margin-top:20px;text-align:left;white-space:pre-wrap;line-height:1.6;background:#071a2d;padding:15px;border-radius:10px;min-height:60px}
footer{padding:25px;color:#9eb5cb}
</style>
</head>
<body>
<header>
<h1>MEDICINA AI</h1>
<p>Inteligencia artificial al servicio de tu creatividad</p>
<strong>MEDICINA MUSICAL</strong>
</header>
<main>
<div class="panel">
<h2>Tu asistente inteligente</h2>
<p>Pregúntame sobre música, canciones, publicidad o cualquier tema.</p>
<textarea id="pregunta" placeholder="Escribe tu pregunta aquí..."></textarea>
<br>
<button id="enviar" onclick="consultar()">CONSULTAR A MEDICINA AI</button>
<div id="respuesta">Aquí aparecerán las respuestas de tu inteligencia artificial.</div>
</div>
</main>
<footer>Creado para MEDICINA MUSICAL © 2026</footer>
<script>
async function consultar(){
const pregunta=document.getElementById("pregunta").value.trim();
const respuesta=document.getElementById("respuesta");
const boton=document.getElementById("enviar");
if(!pregunta){respuesta.textContent="Por favor, escribe una pregunta.";return;}
boton.disabled=true;
respuesta.textContent="MEDICINA AI está pensando...";
try{
const resultado=await fetch("https://medicina-ai.grupomedicinamusical.workers.dev/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({pregunta})
});
const datos=await resultado.json();
if(!resultado.ok)throw new Error(datos.error||"No se pudo obtener respuesta.");
respuesta.textContent=datos.respuesta||datos.error||"No recibí una respuesta.";
}catch(error){
respuesta.textContent="Error: "+error.message;
}finally{
boton.disabled=false;
}
}
</script>
</body>
</html>
